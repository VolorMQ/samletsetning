<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Søgeordsspil</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #000;
    color: #fff;
  }

  /* Контейнер для правильного масштабирования */
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh; /* фиксированная высота, картинка не вылезет */
    max-height: 100%;
    margin: 0 auto;
    overflow: hidden;
  }

  #game {
    position: relative;
    width: 100%;
    height: 100%;
  }

  #game img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .item {
    position: absolute;
    cursor: pointer;
  }

  /* Слово сверху */
  #word {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 10px;
    z-index: 20;
    display: flex;
    align-items: center;
  }
  #level-bg {
    max-width: none !important;
    max-height: none !important;
    width: auto !important;
    height: auto !important;
    object-fit: unset !important;
  }
  
  #gameDiv {
    overflow: scroll;     /* картинка может быть больше экрана */
    position: relative;
  }

  /* Статистика */
  #stats {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    background: rgba(0,0,0,0.5);
    padding: 5px 15px;
    border-radius: 10px;
    z-index: 20;
  }

  /* Меню */
  #menu {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 20;
  }

  .btn {
    background: #222;
    border: 2px solid #888;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 18px;
  }
  .btn:hover {
    background: #444;
  }

  /* Фейерверк */
  .firework {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.8s ease-out forwards;
  }
  @keyframes explode {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  /* Диалог */
  #dialog {
    display: none;
    position: absolute;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.8);
    padding: 20px;
    z-index: 30;
  }
  #dialog p {
    font-size: 22px;
    margin: 0 0 10px 0;
  }
  #dialog button {
    padding: 10px 20px;
    font-size: 20px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="game">
    <div id="word">Tryk på en sværhedsgrad</div>
    <img id="level-bg" src="" alt="Level background">
    <div id="menu">
      <div class="btn" onclick="startGame('let')">Let (90s)</div>
      <div class="btn" onclick="startGame('mellem')">Mellem (60s)</div>
      <div class="btn" onclick="startGame('svaer')">Svær (45s)</div>
      <div class="btn" onclick="restartGame()">Nyt spil</div>
    </div>

    <div id="stats">
      Rigtige: <span id="correct">0</span> |
      Forkerte: <span id="wrong">0</span> |
      Fundet: <span id="found">0</span>/<span id="total">0</span> |
      Tid: <span id="time">0</span>s
    </div>

    <div id="dialog">
      <p id="dialog-line"></p>
      <div id="dialog-options" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>
  </div>
</div>

<script>
let levels = [];
fetch("levels.json").then(r => r.json()).then(data => { levels = data; });

let currentLevel = 0;
let orderIndex = 0;
let timerInterval = null;
let currentDifficulty = null;
let correctCount = 0;
let wrongCount = 0;
let foundCount = 0;
let words = [];
let currentIndex = 0;
let timeLeft = 0;
let availableLevels = [];

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const difficulties = { let:90, mellem:60, svaer:45 };
const wordDiv = document.getElementById('word');
const correctSpan = document.getElementById('correct');
const wrongSpan = document.getElementById('wrong');
const foundSpan = document.getElementById('found');
const totalSpan = document.getElementById('total');
const timeSpan = document.getElementById('time');
const gameDiv = document.getElementById('game');

let timerSpanWord = document.createElement('span');
timerSpanWord.style.marginLeft = "15px";
timerSpanWord.style.fontSize = "24px";
timerSpanWord.style.background = "rgba(0,0,0,0.5)";
timerSpanWord.style.padding = "3px 8px";
timerSpanWord.style.borderRadius = "5px";
wordDiv.appendChild(timerSpanWord);

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function resetLevelOrder() {
  availableLevels = [...Array(levels.length).keys()];
  shuffleArray(availableLevels);
}

function getNextLevel() {
  if (!availableLevels.length) resetLevelOrder();
  return availableLevels.shift();
}

function loadLevelDesktop() {
  const lvl = levels[currentLevel];
  const img = document.getElementById('level-bg');
  img.src = lvl.bg;

  document.querySelectorAll('.item').forEach(i => i.remove());

  // дождёмся загрузки изображения
	img.onload = () => {
	  const naturalWidth = (lvl.scale && lvl.scale.width) ? lvl.scale.width : img.naturalWidth;
	  const naturalHeight = (lvl.scale && lvl.scale.height) ? lvl.scale.height : img.naturalHeight;

	  const clientWidth = img.clientWidth;
	  const clientHeight = img.clientHeight;

	  // равномерный масштаб (contain)
	  const scale = Math.min(clientWidth / naturalWidth, clientHeight / naturalHeight);

	  // видимая часть картинки и отступ внутри <img> (центрирование)
	  const visW = naturalWidth * scale;
	  const visH = naturalHeight * scale;
	  const offsetX = (clientWidth - visW) / 2;
	  const offsetY = (clientHeight - visH) / 2;

	  // helper: пересечение прямоугольников
	  function intersectionArea(ax, ay, aw, ah, bx, by, bw, bh) {
		const ix = Math.max(ax, bx);
		const iy = Math.max(ay, by);
		const ir = Math.min(ax + aw, bx + bw);
		const ib = Math.min(ay + ah, by + bh);
		const iw = Math.max(0, ir - ix);
		const ih = Math.max(0, ib - iy);
		return iw * ih;
	  }

	  // видимая картинка в координатах элемента img (лев.верх = 0,0 внутри img)
	  const imgVisibleX = offsetX;
	  const imgVisibleY = offsetY;
	  const imgVisibleW = visW;
	  const imgVisibleH = visH;

	  lvl.items.forEach(obj => {
		const div = document.createElement("div");
		div.className = "item";
		div.dataset.word = obj.word;

		// исходные проценты
		const pLeft = parseFloat(obj.left);
		const pTop  = parseFloat(obj.top);
		const pW    = parseFloat(obj.w);
		const pH    = parseFloat(obj.h);

		// ---- ВАРИант A: проценты привязаны к исходному изображению (orig-based) ----
		const origLeftPx = (pLeft / 100) * naturalWidth;
		const origTopPx  = (pTop  / 100) * naturalHeight;
		const origWPx    = (pW    / 100) * naturalWidth;
		const origHPx    = (pH    / 100) * naturalHeight;

		const leftA = offsetX + origLeftPx * scale;
		const topA  = offsetY + origTopPx * scale;
		const wA    = Math.max(0, origWPx * scale);
		const hA    = Math.max(0, origHPx * scale);

		// ---- ВАРИант B: проценты привязаны к контейнеру (container-based) ----
		const leftB = (pLeft / 100) * clientWidth;
		const topB  = (pTop  / 100) * clientHeight;
		const wB    = Math.max(0, (pW / 100) * clientWidth);
		const hB    = Math.max(0, (pH / 100) * clientHeight);

		// вычисляем площадь пересечения с видимой картинкой
		const areaA = intersectionArea(leftA, topA, wA, hA, imgVisibleX, imgVisibleY, imgVisibleW, imgVisibleH);
		const areaB = intersectionArea(leftB, topB, wB, hB, imgVisibleX, imgVisibleY, imgVisibleW, imgVisibleH);

		// выбираем вариант с большей пересекаемой площадью (если оба 0 -> берем A)
		const useA = (areaA >= areaB);

		let finalLeft, finalTop, finalW, finalH;
		if (useA) {
		  finalLeft = leftA;
		  finalTop  = topA;
		  finalW    = wA;
		  finalH    = hA;
		} else {
		  finalLeft = leftB;
		  finalTop  = topB;
		  finalW    = wB;
		  finalH    = hB;
		}

		// Ограничение: не даём выйти за видимую картинку
		if (finalLeft < imgVisibleX) finalLeft = imgVisibleX;
		if (finalTop < imgVisibleY) finalTop = imgVisibleY;
		if (finalLeft + finalW > imgVisibleX + imgVisibleW) finalW = Math.max(0, imgVisibleX + imgVisibleW - finalLeft);
		if (finalTop + finalH > imgVisibleY + imgVisibleH) finalH = Math.max(0, imgVisibleY + imgVisibleH - finalTop);

		// Убираем CSS translate, чтобы left/top были левым верхом
		div.style.transform = "";

		// Применяем
		div.style.left   = `${Math.round(finalLeft)}px`;
		div.style.top    = `${Math.round(finalTop)}px`;
		div.style.width  = `${Math.round(finalW)}px`;
		div.style.height = `${Math.round(finalH)}px`;

		div.addEventListener("click", () => itemClick(div));
		gameDiv.appendChild(div);
	  });
	};
}

function loadLevelMobile() {
  const lvl = levels[currentLevel];
  const img = document.getElementById('level-bg');
  img.src = lvl.bg;

  // удаляем старые зоны
  document.querySelectorAll('.item').forEach(i => i.remove());

  const gameDiv = document.getElementById('gameDiv');

  function renderMobile() {
    document.querySelectorAll('.item').forEach(i => i.remove());

    const naturalW = lvl.scale?.width  || img.naturalWidth;
    const naturalH = lvl.scale?.height || img.naturalHeight;

    const contW = gameDiv.clientWidth;
    const contH = gameDiv.clientHeight;

    // --- ВАЖНО ---
    // На мобильном НЕ пытаемся впихнуть горизонтальное изображение в вертикальный экран.
    // Масштабируем только по ширине.
    const scale = contW / naturalW;

    const visW = naturalW * scale;
    const visH = naturalH * scale;

	img.style.width = visW + "px";
	img.style.height = visH + "px";
	img.style.maxWidth = "none";
	img.style.maxHeight = "none";

    // если картинка выше контейнера — разрешаем скролл
    if (visH > contH) {
      gameDiv.style.overflowY = "scroll";
    } else {
      gameDiv.style.overflowY = "hidden";
    }

    // позиция картинки внутри контейнера
    const offsetX = (contW - visW) / 2;
    const offsetY = (contH - visH) / 2;

    const imgRect  = img.getBoundingClientRect();
    const gameRect = gameDiv.getBoundingClientRect();

    const imgX = imgRect.left - gameRect.left;
    const imgY = imgRect.top  - gameRect.top;

    const MIN_HIT = Math.max(40, Math.round(visW * 0.04));

    lvl.items.forEach(obj => {
      const div = document.createElement("div");
      div.className = "item";
      div.dataset.word = obj.word;

      const pLeft = parseFloat(obj.left);
      const pTop  = parseFloat(obj.top);
      const pW    = parseFloat(obj.w);
      const pH    = parseFloat(obj.h);

      // координаты строго в рамках видимой картинки
      let leftPx = imgX + offsetX + (pLeft / 100) * visW;
      let topPx = imgY + offsetY + (pTop / 100) * visH;
      let widthPx  = (pW / 100) * visW;
      let heightPx = (pH / 100) * visH;

      // минимальный размер
      if (widthPx < MIN_HIT) {
        const cx = leftPx + widthPx / 2;
        widthPx = MIN_HIT;
        leftPx = cx - widthPx / 2;
      }
      if (heightPx < MIN_HIT) {
        const cy = topPx + heightPx / 2;
        heightPx = MIN_HIT;
        topPx = cy - heightPx / 2;
      }

      // чтобы зона не выходила за пределы изображения
      if (leftPx < imgX) leftPx = imgX;
      if (topPx < imgY) topPx = imgY;

      if (leftPx + widthPx > imgX + visW)
        widthPx = imgX + visW - leftPx;

      if (topPx + heightPx > imgY + visH)
        heightPx = imgY + visH - topPx;

      div.style.left   = `${Math.round(leftPx)}px`;
      div.style.top    = `${Math.round(topPx)}px`;
      div.style.width  = `${Math.round(widthPx)}px`;
      div.style.height = `${Math.round(heightPx)}px`;

      div.addEventListener("click", () => itemClick(div));
      gameDiv.appendChild(div);
    });
  }

  img.onload = () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        renderMobile();
      });
    });

    let rt = null;
    const deb = () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            renderMobile();
          });
        });
      }, 150);
    };

    window.addEventListener("resize", deb);
    window.addEventListener("orientationchange", deb);
  };

  if (img.complete && img.naturalWidth) img.onload();
}



// В runLevel выбираем функцию в зависимости от устройства
function runLevel() {
  currentLevel = getNextLevel();

  timeLeft = difficulties[currentDifficulty];
  correctCount = 0;
  wrongCount = 0;
  foundCount = 0;

  if (isMobile) {
    loadLevelMobile();
  } else {
    loadLevelDesktop();
  }

  words = levels[currentLevel].items.map(i => i.word).sort(() => Math.random() - 0.5);
  currentIndex = 0;
  totalSpan.textContent = words.length;
  updateStats();

  document.getElementById("menu").style.display = "none";
  document.getElementById("stats").style.display = "none";
  document.getElementById("dialog").style.display = "none";

  showWord();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

function startGame(mode) {
  currentDifficulty = mode;
  resetLevelOrder();
  runLevel();
}

function restartGame() { location.reload(); }

function tick() {
  timeLeft--;
  timerSpanWord.textContent = `Tid: ${timeLeft}s`;
  if (timeLeft <= 0) endGame(false);
}

function showWord() {
  if (currentIndex < words.length) {
    wordDiv.textContent = "Find: " + words[currentIndex];
    wordDiv.appendChild(timerSpanWord);
  } else {
    endGame(true);
  }
}

function updateStats() {
  correctSpan.textContent = correctCount;
  wrongSpan.textContent = wrongCount;
  foundSpan.textContent = foundCount;
  timeSpan.textContent = timeLeft;
}

function itemClick(item) {
  if (!timerInterval) return;
  const targetWord = words[currentIndex];
  const rect = item.getBoundingClientRect();
  const x = rect.left + rect.width/2;
  const y = rect.top + rect.height/2;

  if (item.dataset.word === targetWord) {
    correctCount++;
    foundCount++;
    currentIndex++;
    spawnFirework(x, y);
  } else {
    wrongCount++;
  }

  updateStats();
  showWord();
}

function endGame(win) {
  clearInterval(timerInterval);
  timerInterval = null;
  timerSpanWord.textContent = "";

  const stats = document.getElementById("stats");
  stats.style.position = "absolute";
  stats.style.top = "50%";
  stats.style.left = "50%";
  stats.style.transform = "translate(-50%, -50%)";
  stats.style.display = "block";

  const menu = document.getElementById("menu");
  menu.style.position = "absolute";
  menu.style.top = "70px";
  menu.style.left = "50%";
  menu.style.transform = "translateX(-50%)";
  menu.style.display = "flex";

  wordDiv.textContent = win ? "Du fandt alt! 🎉" : "Tid er slut! ❌";
  document.querySelectorAll('.item').forEach(i => i.style.pointerEvents = "none");

  if (win && levels[currentLevel] && levels[currentLevel].dialog.length) startDialog();
}

function spawnFirework(x, y) {
  for (let i = 0; i < 10; i++) {
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
    fw.style.left = `${x}px`;
    fw.style.top = `${y}px`;
    fw.style.transform = `translate(-50%, -50%) rotate(${Math.random()*360}deg)`;
    gameDiv.appendChild(fw);
    setTimeout(() => fw.remove(), 800);
  }
}

// Диалог
let dialogStep = 0;
function startDialog() {
  dialogStep = 0;
  buildDialogUI();
  document.getElementById("dialog").style.display = "block";
  showDialog();
}
function buildDialogUI() {
  const dlg = document.getElementById("dialog");
  dlg.innerHTML = `
    <p id="dialog-line"></p>
    <div id="dialog-options" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
  `;
}
function showDialog() {
  const npcLine = levels[currentLevel].dialog[dialogStep][0];
  const correctAnswer = levels[currentLevel].dialog[dialogStep][1];
  const dialogLine = document.getElementById("dialog-line");
  dialogLine.textContent = npcLine;
  const container = document.getElementById("dialog-options");
  container.innerHTML = "";
  const allPlayerAnswers = levels[currentLevel].dialog.map(pair => pair[1]).sort(() => Math.random() - 0.5);
  allPlayerAnswers.forEach(answer => {
    const btn = document.createElement("button");
    btn.style.padding = "10px 20px";
    btn.style.fontSize = "20px";
    btn.textContent = answer;
    btn.onclick = () => {
      if (answer === correctAnswer) {
        dialogStep++;
        if (dialogStep >= levels[currentLevel].dialog.length) {
          document.getElementById("dialog").style.display = "none";
          nextLevel();
        } else {
          showDialog();
        }
      } else {
        const prevText = dialogLine.textContent;
        dialogLine.textContent = "Jeg forstår ikke, hvad du mener.";
        container.querySelectorAll("button").forEach(b => b.disabled = true);
        setTimeout(() => {
          dialogLine.textContent = prevText;
          container.querySelectorAll("button").forEach(b => b.disabled = false);
        }, 3000);
      }
    };
    container.appendChild(btn);
  });
}

function nextLevel() {
  if (!availableLevels.length) {
    // если уровни закончились — показываем экран конца игры
    const endStats = document.createElement("div");
    endStats.innerHTML = `
      <div style="
        width:100%; height:100%;
        background: url('end.gif') center/cover no-repeat;
        display:flex; justify-content:center; align-items:center;
        flex-direction:column; color:#fff; text-align:center;
      ">
        <h1 style="font-size:40px; margin-bottom:20px;">Spillet er slut! 🎉</h1>
        <p style="font-size:24px; margin-bottom:10px;">Rigtige: ${correctCount}</p>
        <p style="font-size:24px; margin-bottom:30px;">Forkerte: ${wrongCount}</p>
        <button id="restartBtn" style="
          padding:20px 40px; font-size:28px; border-radius:10px;
          cursor:pointer; background:#222; color:#fff; border:2px solid #888;
        ">Start igen</button>
      </div>
    `;
    gameDiv.innerHTML = "";
    gameDiv.appendChild(endStats);
    document.getElementById("restartBtn").onclick = () => location.reload();
    return;
  }
  runLevel();
}
</script>

</body>
</html>
