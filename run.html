<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Søgeordsspil</title>
<style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
      color: #fff;
    }

  /* Контейнер для правильного масштабирования */
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-height: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #game img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

  /* overlay — область ровно под видимой картинкой */
    #overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      pointer-events: auto;
      z-index: 5;
    }

    .item {
      position: absolute;
      cursor: pointer;
      z-index: 10;
    }

  /* Слово сверху */
    #word {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
    }

  /* Статистика */
    #stats {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      background: rgba(0,0,0,0.5);
      padding: 5px 15px;
      border-radius: 10px;
      z-index: 20;
    }

  /* Меню — по умолчанию скрыто, показывается после Start */
    #menu {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: none; /* скрываем пока не нажали Start */
      gap: 10px;
      z-index: 20;
    }

    .btn {
      background: #222;
      border: 2px solid #888;
      padding: 8px 18px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 18px;
    }
    .btn:hover {
      background: #444;
    }

  /* Фейерверк */
    .firework {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      pointer-events: none;
      animation: explode 0.8s ease-out forwards;
      z-index: 15;
    }
     
	@keyframes explode {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

  /* Диалог */
    #dialog {
      display: none;
      position: absolute;
      bottom: 0;
      width: 100%;
	  background: rgba(0,0,0,0.8);
      padding: 20px;
      z-index: 30;
    }
    #dialog p {
      font-size: 22px;
      margin: 0 0 10px 0;
    }
    #dialog button {
      padding: 10px 20px;
      font-size: 20px;
      margin-left: 10px;
    }

/* 🔥 Стартовый экран с фоновым GIF */
	#startScreen {
	  position:fixed;
	  top:0;
	  left:0;
	  width:100%;
	  height:100%;
	  background: url('your-animation.gif') center/cover no-repeat;
	  display:flex;
	  justify-content:center;
	  align-items:center;
	  z-index:50;
	  color:#fff;
	}

	/* Полупрозрачное окно */
	#startCard {
	  width:92%;
	  max-width:520px;
	  background: rgba(0,0,0,0.55);
	  padding:28px;
	  border-radius:12px;
	  text-align:center;
	  color:#fff;
	  backdrop-filter: blur(6px);
	}

	#startCard h1 {
	  margin:0 0 12px 0;
	  font-size:28px;
	}

	#startCard p {
	  margin:0 0 18px 0;
	  font-size:16px;
	  color:#ddd;
	}

	/* Поле имени */
	#playerName {
	  width:100%;
	  padding:12px;
	  font-size:18px;
	  border-radius:8px;
	  border:2px solid #444;
	  background:#111;
	  color:#fff;
	  box-sizing:border-box;
	}

	/* Блок кнопки */
	#startControls {
	  margin-top:14px;
	  display:flex;
	  gap:10px;
	  justify-content:center;
	  align-items:center;
	}

	/* Кнопка */
	#startBtn {
	  padding:10px 18px;
	  font-size:18px;
	  cursor:pointer;
	  border-radius:8px;
	  border:2px solid #888;
	  background:#222;
	  color:#fff;
	}

	#startBtn:hover {
	  background:#444;
	}

	/* Ошибка */
	#nameError {
	  color:#ff6b6b;
	  margin-top:10px;
	  font-size:14px;
	  display:none;
	}

	.error {
	  border-color:#ff6b6b !important;
	  box-shadow:0 0 8px rgba(255,107,107,0.2);
	}

	#startScreen.fade-out {
	  opacity: 0;
	  transition: opacity 0.5s ease;
	}
</style>
</head>
<body>

<div id="gameContainer">
  <div id="game">
    <div id="word">Tryk på en sværhedsgrad</div>
    <img id="level-bg" src="your-animation.gif" alt="Level background">
    <!-- overlay: сюда добавляем все .item, точно поверх видимой картинки -->
    <div id="overlay"></div>

    <div id="menu">
	  <span id="playerNameDisplay">—</span>
      <div class="btn" onclick="startGame('let')">Let (90s)</div>
      <div class="btn" onclick="startGame('mellem')">Mellem (60s)</div>
      <div class="btn" onclick="startGame('svaer')">Svær (45s)</div>
      <div class="btn" onclick="restartGame()">Nyt spil</div>
    </div>

    <div id="stats">
      Spiller: <span id="playerName">—</span> |
      Rigtige: <span id="correct">0</span> |
      Forkerte: <span id="wrong">0</span> |
      Fundet: <span id="found">0</span>/<span id="total">0</span> |
      Tid: <span id="time">0</span>s
    </div>

    <div id="dialog">
      <p id="dialog-line"></p>
      <div id="dialog-options" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>

	<!-- START SCREEN -->
	<div id="startScreen" aria-hidden="false">
	  <div id="startCard" role="dialog" aria-labelledby="startTitle" aria-modal="true">
		<h1 id="startTitle">Velkommen til Søgeordsspil</h1>
		<p>Indtast dit navn for at starte spillet. Navnet gemmes lokalt.</p>

		<!-- Сохраняем id для input, чтобы CSS работал -->
		<input id="playerName" type="text" placeholder="Skriv dit navn her" maxlength="30" autocomplete="name" />

		<div id="startControls">
		  <button id="startBtn" class="btn" type="button">Start</button>
		</div>
		<div id="nameError" style="display:none">Indtast et navn for at fortsætte.</div>
	  </div>
	</div>
	<!-- /START SCREEN -->

  </div>
</div>

<script>
let levels = [];
fetch("levels.json").then(r => r.json()).then(data => { levels = data; });

let currentLevel = 0;
let orderIndex = 0;
let timerInterval = null;
let currentDifficulty = null;
let correctCount = 0;
let wrongCount = 0;
let foundCount = 0;
let words = [];
let currentIndex = 0;
let timeLeft = 0;
let availableLevels = [];

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const difficulties = { let:90, mellem:60, svaer:45 };
const wordDiv = document.getElementById('word');
const correctSpan = document.getElementById('correct');
const wrongSpan = document.getElementById('wrong');
const foundSpan = document.getElementById('found');
const totalSpan = document.getElementById('total');
const timeSpan = document.getElementById('time');
const gameDiv = document.getElementById('game');
const overlay = document.getElementById('overlay');

let dialogAttempts = 0;
const MAX_DIALOG_ATTEMPTS = 3;

let timerSpanWord = document.createElement('span');
timerSpanWord.style.marginLeft = "15px";
timerSpanWord.style.fontSize = "24px";
timerSpanWord.style.background = "rgba(0,0,0,0.5)";
timerSpanWord.style.padding = "3px 8px";
timerSpanWord.style.borderRadius = "5px";
wordDiv.appendChild(timerSpanWord);

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function resetLevelOrder() {
  availableLevels = [...Array(levels.length).keys()];
  shuffleArray(availableLevels);
}

function getNextLevel() {
  if (!availableLevels.length) resetLevelOrder();
  return availableLevels.shift();
}

function clearItems() {
  // удаляем старые зоны из overlay
  overlay.innerHTML = "";
}

function setOverlay(x, y, w, h) {
  overlay.style.left = `${Math.round(x)}px`;
  overlay.style.top = `${Math.round(y)}px`;
  overlay.style.width = `${Math.round(w)}px`;
  overlay.style.height = `${Math.round(h)}px`;
  overlay.style.pointerEvents = "auto";
}

function loadLevelDesktop() {
  const lvl = levels[currentLevel];
  const img = document.getElementById('level-bg');
  img.src = lvl.bg;

  clearItems();

  const onImg = () => {
    // реальные размеры исходного изображения (в пикселях)
    const naturalWidth  = (lvl.scale && lvl.scale.width)  ? lvl.scale.width  : img.naturalWidth;
    const naturalHeight = (lvl.scale && lvl.scale.height) ? lvl.scale.height : img.naturalHeight;

    const clientWidth  = img.clientWidth;
    const clientHeight = img.clientHeight;

    // равномерный масштаб (contain)
    const scale = Math.min(clientWidth / naturalWidth, clientHeight / naturalHeight);

    // видимая часть картинки и отступ внутри <img> (центрирование)
    const visW = naturalWidth * scale;
    const visH = naturalHeight * scale;
    const offsetX = (clientWidth - visW) / 2;
    const offsetY = (clientHeight - visH) / 2;

    // позиция <img> и #game на экране (viewport)
    const imgRect = img.getBoundingClientRect();
    const gameRect = gameDiv.getBoundingClientRect();

    // позиция видимой картинки внутри gameDiv (в пикселях от левого верхнего угла gameDiv)
    const imgLeftInGame = (imgRect.left - gameRect.left) + offsetX;
    const imgTopInGame  = (imgRect.top  - gameRect.top)  + offsetY;

    // устанавливаем overlay точно под видимой картинкой (координаты внутри gameDiv)
    setOverlay(imgLeftInGame, imgTopInGame, visW, visH);

    // вспомогательная функция ограничения по границам видимой картинки
    function clampZone(relLeft, relTop, w, h) {
      if (relLeft < 0) {
        const shift = -relLeft;
        relLeft = 0;
        w = Math.max(0, w - shift);
      }
      if (relTop < 0) {
        const shift = -relTop;
        relTop = 0;
        h = Math.max(0, h - shift);
      }
      if (relLeft + w > visW) w = Math.max(0, visW - relLeft);
      if (relTop + h > visH) h = Math.max(0, visH - relTop);
      return { relLeft, relTop, w, h };
    }

    lvl.items.forEach(obj => {
      const div = document.createElement("div");
      div.className = "item";
      div.dataset.word = obj.word;

      // исходные проценты
      const pLeft = parseFloat(obj.left);
      const pTop  = parseFloat(obj.top);
      const pW    = parseFloat(obj.w);
      const pH    = parseFloat(obj.h);

      // ---- ВАРИант A: проценты привязаны к исходному изображению (orig-based) ----
      const origLeftPx = (pLeft / 100) * naturalWidth;
      const origTopPx  = (pTop  / 100) * naturalHeight;
      const origWPx    = (pW    / 100) * naturalWidth;
      const origHPx    = (pH    / 100) * naturalHeight;

      // вычисляем координаты и размеры внутри видимой картинки (relative to overlay)
      let relLeft = origLeftPx * scale; // координата внутри overlay
      let relTop  = origTopPx  * scale;
      let finalW  = Math.max(1, origWPx * scale);
      let finalH  = Math.max(1, origHPx * scale);

      // ограничим зону, чтобы не выходила за видимую картинку
      const clamped = clampZone(relLeft, relTop, finalW, finalH);
      relLeft = clamped.relLeft;
      relTop  = clamped.relTop;
      finalW  = clamped.w;
      finalH  = clamped.h;

      // если после ограничения зона стала нулевой — пропускаем
      if (finalW <= 0 || finalH <= 0) return;

      div.style.left   = `${Math.round(relLeft)}px`;
      div.style.top    = `${Math.round(relTop)}px`;
      div.style.width  = `${Math.round(finalW)}px`;
      div.style.height = `${Math.round(finalH)}px`;

      div.addEventListener("click", () => itemClick(div));
      overlay.appendChild(div);
    });
  };

  img.onload = onImg;
  // если картинка уже загружена (кеш), вызовем обработчик сразу
  if (img.complete && img.naturalWidth) onImg();
}


function loadLevelMobile() {
  const lvl = levels[currentLevel];
  const img = document.getElementById('level-bg');
  img.src = lvl.bg;

  clearItems();

  function clampZone(relLeft, relTop, w, h, visW, visH) {
    if (relLeft < 0) {
      const shift = -relLeft;
      relLeft = 0;
      w = Math.max(0, w - shift);
    }
    if (relTop < 0) {
      const shift = -relTop;
      relTop = 0;
      h = Math.max(0, h - shift);
    }
    if (relLeft + w > visW) w = Math.max(0, visW - relLeft);
    if (relTop + h > visH) h = Math.max(0, visH - relTop);
    return { relLeft, relTop, w, h };
  }

  function renderMobile() {
    clearItems();

    // реальные размеры исходного изображения
    const naturalWidth  = (lvl.scale && lvl.scale.width)  ? lvl.scale.width  : img.naturalWidth;
    const naturalHeight = (lvl.scale && lvl.scale.height) ? lvl.scale.height : img.naturalHeight;

    // ширина контейнера (gameDiv)
    const containerW = gameDiv.clientWidth;

    // масштабируем по ширине
    const scale = containerW / naturalWidth;
    const visW = naturalWidth * scale;
    const visH = naturalHeight * scale;

    // применяем размеры
    img.style.width  = `${Math.round(visW)}px`;
    img.style.height = `${Math.round(visH)}px`;
    img.style.display = "block";
    img.style.marginLeft = "auto";
    img.style.marginRight = "auto";

    // вертикальный скролл при необходимости
    gameDiv.style.overflowY = (visH > gameDiv.clientHeight) ? "scroll" : "hidden";

    // позиция изображения внутри gameDiv
    const imgRect = img.getBoundingClientRect();
    const gameRect = gameDiv.getBoundingClientRect();
    const imgLeftInGame = imgRect.left - gameRect.left;
    const imgTopInGame  = imgRect.top  - gameRect.top;

    // overlay
    setOverlay(imgLeftInGame, imgTopInGame, visW, visH);

    const MIN_HIT = Math.max(40, Math.round(visW * 0.04));

    lvl.items.forEach(obj => {
      const div = document.createElement("div");
      div.className = "item";
      div.dataset.word = obj.word;

      const pLeft = parseFloat(obj.left);
      const pTop  = parseFloat(obj.top);
      const pW    = parseFloat(obj.w);
      const pH    = parseFloat(obj.h);

      // конвертируем координаты исходного изображения
      const origLeftPx = (pLeft / 100) * naturalWidth;
      const origTopPx  = (pTop  / 100) * naturalHeight;
      const origWPx    = (pW    / 100) * naturalWidth;
      const origHPx    = (pH    / 100) * naturalHeight;

      let leftPx   = origLeftPx * scale;
      let topPx    = origTopPx  * scale;
      let widthPx  = Math.max(1, origWPx * scale);
      let heightPx = Math.max(1, origHPx * scale);

      // минимальный размер
      if (widthPx < MIN_HIT) {
        const cx = leftPx + widthPx / 2;
        widthPx = MIN_HIT;
        leftPx = cx - widthPx / 2;
      }
      if (heightPx < MIN_HIT) {
        const cy = topPx + heightPx / 2;
        heightPx = MIN_HIT;
        topPx = cy - heightPx / 2;
      }

      // обрезка зон по картинке
      const clamped = clampZone(leftPx, topPx, widthPx, heightPx, visW, visH);
      if (clamped.w <= 0 || clamped.h <= 0) return;

      div.style.left   = `${Math.round(clamped.relLeft)}px`;
      div.style.top    = `${Math.round(clamped.relTop)}px`;
      div.style.width  = `${Math.round(clamped.w)}px`;
      div.style.height = `${Math.round(clamped.h)}px`;

      div.addEventListener("click", () => itemClick(div));
      overlay.appendChild(div);
    });
  }

  img.onload = () => {
    // двойной RAF для точности
    requestAnimationFrame(() => requestAnimationFrame(renderMobile));

    // навешиваем обработчики один раз
    if (!window.__mobileLevelResizeAdded) {
      let rt = null;

      const deb = () => {
        clearTimeout(rt);
        rt = setTimeout(() =>
          requestAnimationFrame(() =>
            requestAnimationFrame(renderMobile)
          ),
        150);
      };

      window.addEventListener("resize", deb);
      window.addEventListener("orientationchange", deb);

      // NEW: orientation fix — пересчёт сразу при реальном повороте
      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener("change", () => {
          requestAnimationFrame(() => requestAnimationFrame(renderMobile));
        });
      }

      window.__mobileLevelResizeAdded = true;
    }
  };

  if (img.complete && img.naturalWidth) img.onload();
}


// В runLevel выбираем функцию в зависимости от устройства
function runLevel() {
  currentLevel = getNextLevel();

  timeLeft = difficulties[currentDifficulty];
  correctCount = 0;
  wrongCount = 0;
  foundCount = 0;

  if (isMobile) {
    loadLevelMobile();
  } else {
    loadLevelDesktop();
  }

  words = levels[currentLevel].items.map(i => i.word).sort(() => Math.random() - 0.5);
  currentIndex = 0;
  totalSpan.textContent = words.length;
  updateStats();

  document.getElementById("menu").style.display = "none";
  document.getElementById("stats").style.display = "none";
  document.getElementById("dialog").style.display = "none";

  showWord();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

function startGame(mode) {
  currentDifficulty = mode;
  resetLevelOrder();
  runLevel();
}

function restartGame() { location.reload(); }

function tick() {
  timeLeft--;
  timerSpanWord.textContent = `Tid: ${timeLeft}s`;
  if (timeLeft <= 0) endGame(false);
}

function showWord() {
  if (currentIndex < words.length) {
    wordDiv.textContent = "Find: " + words[currentIndex];
    wordDiv.appendChild(timerSpanWord);
  } else {
    endGame(true);
  }
}

function updateStats() {
  correctSpan.textContent = correctCount;
  wrongSpan.textContent = wrongCount;
  foundSpan.textContent = foundCount;
  timeSpan.textContent = timeLeft;
}

function itemClick(item) {
  if (!timerInterval) return;
  const targetWord = words[currentIndex];

  // rect относительно viewport, но мы используем центр для фейерверка (переводим в координаты relative-to-gameDiv)
  const rect = item.getBoundingClientRect();
  const gameRect = gameDiv.getBoundingClientRect();
  const x = rect.left + rect.width/2 - gameRect.left;
  const y = rect.top + rect.height/2 - gameRect.top;

  if (item.dataset.word === targetWord) {
    correctCount++;
    foundCount++;
    currentIndex++;
    spawnFirework(x, y);
  } else {
    wrongCount++;
  }

  updateStats();
  showWord();
}

function endGame(win) {
  clearInterval(timerInterval);
  timerInterval = null;
  timerSpanWord.textContent = "";

  const stats = document.getElementById("stats");
  stats.style.position = "absolute";
  stats.style.top = "50%";
  stats.style.left = "50%";
  stats.style.transform = "translate(-50%, -50%)";
  stats.style.display = "block";

  const menu = document.getElementById("menu");
  menu.style.position = "absolute";
  menu.style.top = "70px";
  menu.style.left = "50%";
  menu.style.transform = "translateX(-50%)";
  menu.style.display = "flex";

  wordDiv.textContent = win ? "Du fandt alt! 🎉" : "Tid er slut! ❌";
  document.querySelectorAll('.item').forEach(i => i.style.pointerEvents = "none");

  if (win && levels[currentLevel] && levels[currentLevel].dialog.length) startDialog();
}

function spawnFirework(x, y) {
  for (let i = 0; i < 10; i++) {
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
    fw.style.left = `${x}px`;
    fw.style.top = `${y}px`;
    fw.style.transform = `translate(-50%, -50%) rotate(${Math.random()*360}deg)`;
    gameDiv.appendChild(fw);
    setTimeout(() => fw.remove(), 800);
  }
}

// Диалог
let dialogStep = 0;
function startDialog() {
  dialogStep = 0;
  dialogAttempts = 0;
  buildDialogUI();
  document.getElementById("dialog").style.display = "block";
  showDialog();
}
function buildDialogUI() {
  const dlg = document.getElementById("dialog");
  dlg.innerHTML = `
    <p id="dialog-line"></p>
    <div id="dialog-options" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
  `;
}
function showDialog() {
  const npcLine = levels[currentLevel].dialog[dialogStep][0];
  const correctAnswer = levels[currentLevel].dialog[dialogStep][1];
  const dialogLine = document.getElementById("dialog-line");
  dialogLine.textContent = npcLine;

  const container = document.getElementById("dialog-options");
  container.innerHTML = "";
  container.style.display = "flex";

  // Смешиваем варианты ответов
  const allPlayerAnswers = levels[currentLevel].dialog.map(pair => pair[1]).sort(() => Math.random() - 0.5);

  allPlayerAnswers.forEach(answer => {
    const btn = document.createElement("button");
    btn.style.padding = "10px 20px";
    btn.style.fontSize = "20px";
    btn.textContent = answer;

    btn.onclick = () => {
      if (answer === correctAnswer) {
        dialogStep++;
        dialogAttempts = 0; // сброс попыток при верном ответе
        if (dialogStep >= levels[currentLevel].dialog.length) {
          document.getElementById("dialog").style.display = "none";
          nextLevel(); // переход к следующему уровню
        } else {
          showDialog(); // следующий вопрос диалога
        }
      } else {
        dialogAttempts++;
        if (dialogAttempts >= MAX_DIALOG_ATTEMPTS) {
          dialogLine.textContent = "Du har fejlet 3 gange. Niveauet genstartes ❌";
          container.style.display = "none";
          setTimeout(() => {
            document.getElementById("dialog").style.display = "none";
            dialogStep = 0;
            dialogAttempts = 0;
            runLevel(); // перезапуск уровня с предметами
          }, 3000);
        } else {
          const prevText = dialogLine.textContent;
          dialogLine.textContent = `Forkert! Forsøg ${dialogAttempts}/${MAX_DIALOG_ATTEMPTS}`;
          container.querySelectorAll("button").forEach(b => b.disabled = true);
          setTimeout(() => {
            dialogLine.textContent = prevText;
            container.querySelectorAll("button").forEach(b => b.disabled = false);
          }, 2000);
        }
      }
    };

    container.appendChild(btn);
  });
}

function nextLevel() {
  if (!availableLevels.length) {
    // если уровни закончились — показываем экран конца игры
    const endStats = document.createElement("div");
    endStats.innerHTML = `
      <div style="
        width:100%; height:100%;
        background: url('end.gif') center/cover no-repeat;
        display:flex; justify-content:center; align-items:center;
        flex-direction:column; color:#fff; text-align:center;
      ">
        <h1 style="font-size:40px; margin-bottom:20px;">Spillet er slut! 🎉</h1>
        <p style="font-size:24px; margin-bottom:10px;">Rigtige: ${correctCount}</p>
        <p style="font-size:24px; margin-bottom:30px;">Forkerte: ${wrongCount}</p>
        <button id="restartBtn" style="
          padding:20px 40px; font-size:28px; border-radius:10px;
          cursor:pointer; background:#222; color:#fff; border:2px solid #888;
        ">Start igen</button>
      </div>
    `;
    gameDiv.innerHTML = "";
    gameDiv.appendChild(endStats);
    document.getElementById("restartBtn").onclick = () => location.reload();
    return;
  }
  runLevel();
}


/* ---------------------------
   START SCREEN логика
   --------------------------- */
const startScreen = document.getElementById('startScreen');
const nameInput = document.getElementById('playerName'); // уникальный id для input
const startBtn = document.getElementById('startBtn');
const nameError = document.getElementById('nameError');
const playerNameSpan = document.getElementById('playerNameDisplay'); // уникальный id для отображения
const menuDiv = document.getElementById('menu');

function setPlayerName(name) {
  playerNameSpan.textContent = name || '—';
}

function openMenuAfterStart() {
  startScreen.classList.add('fade-out');
  setTimeout(() => {
    startScreen.style.display = 'none';
    startScreen.setAttribute('aria-hidden', 'true');
  }, 500);

  menuDiv.style.display = 'flex';
}

function safeSetStorage(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (e) {
    console.warn('LocalStorage недоступен:', e);
  }
}

function safeGetStorage(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    console.warn('LocalStorage недоступен:', e);
    return null;
  }
}

function handleStart() {
  const name = nameInput.value.trim();
  if (!name) {
    nameError.style.display = 'block';
    nameInput.classList.add('error');
    setTimeout(() => {
      nameError.style.display = 'none';
      nameInput.classList.remove('error');
    }, 2200);
    return;
  }

  safeSetStorage('sg_player_name', name);
  setPlayerName(name);
  openMenuAfterStart();
}

// инициализация
(function initStart() {
  const saved = safeGetStorage('sg_player_name');
  if (saved) nameInput.value = saved;
  setPlayerName(saved || '—');

  // Enter на клавиатуре — предотвращаем дефолтное поведение формы
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleStart();
    }
  });

  // Универсальная обработка клика/касания:
  if (window.PointerEvent) {
    startBtn.addEventListener('pointerup', (e) => {
      // если нужно — можно e.preventDefault();
      handleStart();
    });
  } else {
    // резерв: click + touchstart (touchstart с preventDefault чтобы не было двойного события)
    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // предотвращаем последующий click в некоторых браузерах
      handleStart();
    }, { passive: false });
  }
})();


/* ---------------------------
   Конец START SCREEN логики
   --------------------------- */

</script>
