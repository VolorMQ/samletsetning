<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Søgeordsspil</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #000;
    color: #fff;
  }

  /* Контейнер — только держит изображение и зоны */
  #gameContainer {
    position: relative;
    width: 100vw;
    max-width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }

  /* Фон уровня */
  #game {
    position: relative;
    width: 100%;
    height: auto;
  }

  #game img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
  }

  /* Кликабельные зоны */
  .item {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
  }

  #word {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 10px;
    z-index: 20;
    display: flex;
    align-items: center;
  }

  #stats {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    background: rgba(0,0,0,0.5);
    padding: 5px 15px;
    border-radius: 10px;
    z-index: 20;
  }

  #menu {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 20;
  }

  .btn {
    background: #222;
    border: 2px solid #888;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 18px;
  }
  .btn:hover {
    background: #444;
  }

  .firework {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.8s ease-out forwards;
  }
  @keyframes explode {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  #dialog {
    display: none;
    position: absolute;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.8);
    padding: 20px;
    z-index: 30;
  }
  #dialog p {
    font-size: 22px;
    margin: 0 0 10px 0;
  }
  #dialog button {
    padding: 10px 20px;
    font-size: 20px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="game">

    <div id="word">Tryk på en sværhedsgrad</div>

    <div id="menu">
      <div class="btn" onclick="startGame('let')">Let (90s)</div>
      <div class="btn" onclick="startGame('mellem')">Mellem (60s)</div>
      <div class="btn" onclick="startGame('svaer')">Svær (45s)</div>
      <div class="btn" onclick="restartGame()">Nyt spil</div>
    </div>

    <div id="stats">
      Rigtige: <span id="correct">0</span> |
      Forkerte: <span id="wrong">0</span> |
      Fundet: <span id="found">0</span>/<span id="total">0</span> |
      Tid: <span id="time">0</span>s
    </div>

    <div id="dialog">
      <p id="dialog-line"></p>
      <div id="dialog-options" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>

  </div>
</div>

<script>
let levels = [];
fetch("levels.json")
  .then(r => r.json())
  .then(data => { levels = data; resetLevelOrder(); });

let currentLevel = 0;
let levelOrder = [];
let orderIndex = 0;
let timerInterval = null;
let currentDifficulty = null;
let correctCount = 0;
let wrongCount = 0;
let foundCount = 0;
let words = [];
let currentIndex = 0;
let timeLeft = 0;
let availableLevels = [];

const difficulties = { let:90, mellem:60, svaer:45 };
const wordDiv = document.getElementById('word');
const correctSpan = document.getElementById('correct');
const wrongSpan = document.getElementById('wrong');
const foundSpan = document.getElementById('found');
const totalSpan = document.getElementById('total');
const timeSpan = document.getElementById('time');
const gameDiv = document.getElementById('game');

let timerSpanWord = document.createElement('span');
timerSpanWord.style.marginLeft = "15px";
timerSpanWord.style.fontSize = "24px";
timerSpanWord.style.background = "rgba(0,0,0,0.5)";
timerSpanWord.style.padding = "3px 8px";
timerSpanWord.style.borderRadius = "5px";
wordDiv.appendChild(timerSpanWord);

function resetLevelOrder() {
  availableLevels = [...levels.keys()];
  shuffleArray(availableLevels);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getNextLevel() {
  if (availableLevels.length === 0)
    resetLevelOrder();
  return availableLevels.shift();
}

function startGame(mode) {
  currentDifficulty = mode;
  runLevel();
}

function restartGame() { location.reload(); }

function runLevel() {
  currentLevel = getNextLevel();

  timeLeft = difficulties[currentDifficulty];
  correctCount = 0;
  wrongCount = 0;
  foundCount = 0;

  loadLevel();

  words = levels[currentLevel].items
    .map(i => i.word)
    .sort(() => Math.random() - 0.5);

  currentIndex = 0;
  totalSpan.textContent = words.length;
  updateStats();

  document.getElementById("menu").style.display = "none";
  document.getElementById("stats").style.display = "none";
  document.getElementById("dialog").style.display = "none";

  showWord();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

function loadLevel() {
  const lvl = levels[currentLevel];

  gameDiv.innerHTML = `
      <img src="${lvl.bg}" id="bgImg">
      ${document.getElementById("word").outerHTML}
      ${document.getElementById("menu").outerHTML}
      ${document.getElementById("stats").outerHTML}
      ${document.getElementById("dialog").outerHTML}
  `;

  // восстановить ссылки на элементы
  wordDiv = document.getElementById("word");
  timerSpanWord = document.createElement("span");
  timerSpanWord.style.marginLeft = "15px";
  timerSpanWord.style.fontSize = "24px";
  timerSpanWord.style.background = "rgba(0,0,0,0.5)";
  timerSpanWord.style.padding = "3px 8px";
  timerSpanWord.style.borderRadius = "5px";
  wordDiv.appendChild(timerSpanWord);

  correctSpan = document.getElementById('correct');
  wrongSpan = document.getElementById('wrong');
  foundSpan = document.getElementById('found');
  totalSpan = document.getElementById('total');
  timeSpan = document.getElementById('time');

  // кликабельные зоны
  lvl.items.forEach(obj => {
    const div = document.createElement("div");
    div.className = "item";
    div.dataset.word = obj.word;
    div.style.top = obj.top;
    div.style.left = obj.left;
    div.style.width = obj.w;
    div.style.height = obj.h;
    div.addEventListener("click", () => itemClick(div));
    gameDiv.appendChild(div);
  });
}

function tick() {
  timeLeft--;
  timerSpanWord.textContent = `Tid: ${timeLeft}s`;
  if (timeLeft <= 0) endGame(false);
}

function showWord() {
  if (currentIndex < words.length) {
    wordDiv.textContent = "Find: " + words[currentIndex];
    wordDiv.appendChild(timerSpanWord);
  } else endGame(true);
}

function updateStats() {
  correctSpan.textContent = correctCount;
  wrongSpan.textContent = wrongCount;
  foundSpan.textContent = foundCount;
  timeSpan.textContent = timeLeft;
}

function itemClick(item) {
  if (!timerInterval) return;
  const targetWord = words[currentIndex];

  const rect = item.getBoundingClientRect();
  const x = rect.left + rect.width/2;
  const y = rect.top + rect.height/2;

  if (item.dataset.word === targetWord) {
    correctCount++;
    foundCount++;
    currentIndex++;
    spawnFirework(x, y);
  } else wrongCount++;

  updateStats();
  showWord();
}

function endGame(win) {
  clearInterval(timerInterval);
  timerInterval = null;
  timerSpanWord.textContent = "";

  const stats = document.getElementById("stats");
  stats.style.position = "absolute";
  stats.style.top = "50%";
  stats.style.left = "50%";
  stats.style.transform = "translate(-50%, -50%)";
  stats.style.display = "block";

  const menu = document.getElementById("menu");
  menu.style.display = "flex";

  wordDiv.textContent = win ? "Du fandt alt! 🎉" : "Tid er slut! ❌";
  document.querySelectorAll('.item').forEach(i => i.style.pointerEvents = "none");

  if (win && levels[currentLevel].dialog.length) startDialog();
}

function spawnFirework(x, y) {
  for (let i = 0; i < 10; i++) {
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
    fw.style.left = `${x}px`;
    fw.style.top = `${y}px`;
    fw.style.transform = `translate(-50%, -50%) rotate(${Math.random()*360}deg)`;
    gameDiv.appendChild(fw);
    setTimeout(() => fw.remove(), 800);
  }
}

/* ---- диалоги ---- */

let dialogStep = 0;

function startDialog() {
  dialogStep = 0;
  buildDialogUI();
  document.getElementById("dialog").style.display = "block";
  showDialog();
}

function buildDialogUI() {
  const dlg = document.getElementById("dialog");
  dlg.innerHTML = `
    <p id="dialog-line"></p>
    <div id="dialog-options" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
  `;
}

function showDialog() {
  const npcLine = levels[currentLevel].dialog[dialogStep][0];
  const correctAnswer = levels[currentLevel].dialog[dialogStep][1];

  const dialogLine = document.getElementById("dialog-line");
  dialogLine.textContent = npcLine;

  const container = document.getElementById("dialog-options");
  container.innerHTML = "";

  const allAnswers = levels[currentLevel].dialog.map(p => p[1]);
  allAnswers.sort(() => Math.random() - 0.5);

  allAnswers.forEach(answer => {
    const btn = document.createElement("button");
    btn.textContent = answer;
    btn.style.fontSize = "20px";
    btn.style.padding = "10px 20px";
    btn.onclick = () => {
      if (answer === correctAnswer) {
        dialogStep++;
        if (dialogStep >= levels[currentLevel].dialog.length) {
          document.getElementById("dialog").style.display = "none";
          runLevel();
        } else showDialog();
      } else {
        const prev = dialogLine.textContent;
        dialogLine.textContent = "Jeg forstår ikke, hvad du mener.";
        container.querySelectorAll("button").forEach(b => b.disabled = true);
        setTimeout(() => {
          dialogLine.textContent = prev;
          container.querySelectorAll("button").forEach(b => b.disabled = false);
        }, 3000);
      }
    };
    container.appendChild(btn);
  });
}
</script>

</body>
</html>
