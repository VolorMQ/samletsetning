<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Интерактивный словарь</title>
<style>
  body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
  .word { cursor: pointer; color: #0a58ca; }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  th, td { border: 1px solid #999; padding: 6px 10px; text-align: left; }
  th { background: #f3f3f3; }
  #container { max-width: 1100px; margin: auto; }
  .paragraph { margin-bottom: 1em; }
  .controls { display:flex; gap:10px; align-items:center; margin:12px 0; }
  input[type=text], select { padding:6px; }
  button { padding:6px 10px; cursor:pointer; }
  td.editable { min-width:120px; }
  .small { font-size:0.9em; color:#444; }
</style>
</head>
<body>
<div id="container">
  <h2>Интерактивный словарь</h2>

  <div class="controls">
    <label for="textsSelect">Выберите текст:</label>
    <select id="textsSelect"></select>
    <button id="reloadTexts">Перезагрузить список</button>
    <span class="small">(тексты загружаются из списка `texts_list.json` или можно добавить вручную)</span>
  </div>

  <h3>Текст</h3>
  <div id="text"></div>

  <h3>Выбранные / Редактируемые слова</h3>

  <div style="margin-bottom:8px; display:flex; gap:8px; align-items:center;">
    <button id="saveBtn">Добавить в локальный словарь</button>
    <button id="exportBtn">Экспорт (скачать myDict.json)</button>
    <input id="importFile" type="file" accept="application/json" />
    <button id="clearBtn">Очистить выбранные</button>
  </div>

  <table id="selectedTable">
    <thead>
      <tr>
        <th>Слово</th>
        <th>Перевод</th>
        <th>Тип</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3>Добавить слово вручную</h3>
  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <input id="manualWord" placeholder="Слово" />
    <input id="manualTranslation" placeholder="Перевод" />
    <input id="manualType" placeholder="Тип (часть речи)" />
    <button id="addManual">Добавить</button>
  </div>

  <h3>Локальный словарь (myDict)</h3>
  <div style="margin-bottom:8px;">
    <button id="openLocal">Показать локальный словарь</button>
    <button id="downloadLocal">Скачать локальный словарь</button>
    <button id="importToLocal">Импортировать файл в локальный словарь</button>
  </div>
  <pre id="localPreview" style="max-height:300px; overflow:auto; background:#fafafa; padding:10px; border:1px solid #eee;"></pre>

</div>

<script>
// ---- Настройки ----
const TEXTS_LIST_URL = 'texts_list.json'; // список доступных текстов
let currentTextFile = null;
let dictionaryData = null; // sentences.json structure
let reverseIndex = {}; // word -> {type, translation}
let selected = []; // {word, translation, type}

function normalizeWord(w) {
  return w.trim().toLowerCase().replace(/[^\p{L}æøåÆØÅ0-9'-]/gu, '');
}

// ---- Загрузка JSON ----
async function loadJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('Не удалось загрузить ' + url);
  return await r.json();
}

// ---- Список текстов ----
async function loadTextsList(){
  const sel = document.getElementById('textsSelect');
  sel.innerHTML = '';
  try{
    const list = await loadJSON(TEXTS_LIST_URL);
    list.forEach(item => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify(item);
      opt.textContent = item.name || item.file;
      sel.appendChild(opt);
    });
  } catch(e){
    // если список не найден, добавим вручную один вариант
    const opt = document.createElement('option');
    opt.value = JSON.stringify({ file: 'insord0.json', name: 'Текст 1' });
    opt.textContent = 'Текст 1 (insord0.json)';
    sel.appendChild(opt);
  }
}

// ---- Построение индекса из sentences.json ----
function buildReverseIndex(){
  reverseIndex = {};
  if(!dictionaryData || !dictionaryData.sentences) return;
  dictionaryData.sentences.forEach(sentence => {
    for(const key in sentence){
      if(key === 'full_translation') continue;
      const entry = sentence[key];
      const type = key.replace(/\d+/g, '');
      if(entry && entry.word){
        const base = normalizeWord(entry.word);
        reverseIndex[base] = { type, translation: entry.translation };
      }
    }
  });
}

// ---- Обработка текста: /br -> параграф, обычные переносы игнорируем ----
function processText(raw){
  let processed = raw.replace(/\s*\/br\s*/g, '[[BR]]')
    .replace(/\r/g, '')
    .replace(/\n(?!\n)/g, ' ')
    .trim();
  const paragraphs = processed.split('[[BR]]').map(p => p.trim()).filter(Boolean);
  return paragraphs;
}

// ---- Рендер текста ----
function renderTextParagraphs(paragraphs){
  const container = document.getElementById('text');
  container.innerHTML = '';
  paragraphs.forEach(p => {
    const div = document.createElement('div');
    div.className = 'paragraph';
    div.innerHTML = p.split(/\s+/).map(w => `<span class="word">${w}</span>`).join(' ');
    container.appendChild(div);
  });
  document.querySelectorAll('.word').forEach(el => {
    el.addEventListener('click', () => onWordClick(el.textContent));
  });
}

// ---- Клик по слову ----
function onWordClick(rawWord){
  const clean = normalizeWord(rawWord);
  if(!clean) return;
  if(selected.some(s => s.word === clean)) return;
  const info = reverseIndex[clean] || { type: '', translation: '' };
  selected.push({ word: clean, translation: info.translation || '', type: info.type || '' });
  renderSelectedTable();
}

// ---- Рендер таблицы выбранных слов (редактируемые ячейки) ----
function renderSelectedTable(){
  const tbody = document.querySelector('#selectedTable tbody');
  tbody.innerHTML = '';
  selected.forEach((s, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="editable" contenteditable="true" data-field="word" data-i="${i}">${s.word}</td>
      <td class="editable" contenteditable="true" data-field="translation" data-i="${i}">${s.translation}</td>
      <td class="editable" contenteditable="true" data-field="type" data-i="${i}">${s.type}</td>
      <td>
        <button data-i="${i}" class="saveRow">✔</button>
        <button data-i="${i}" class="deleteRow">✖</button>
      </td>`;
    tbody.appendChild(tr);
  });

  // делегируем изменения
  tbody.querySelectorAll('td[contenteditable]').forEach(td => {
    td.addEventListener('input', e => {
      const i = td.dataset.i;
      const field = td.dataset.field;
      selected[i][field] = td.textContent.trim();
    });
  });

  tbody.querySelectorAll('.deleteRow').forEach(btn => {
    btn.onclick = () => {
      selected.splice(btn.dataset.i, 1);
      renderSelectedTable();
    };
  });

  tbody.querySelectorAll('.saveRow').forEach(btn => {
    btn.onclick = () => {
      // сохраняем строку в localStorage напрямую
      const i = btn.dataset.i;
      saveSingleToLocal(selected[i]);
      alert('Сохранено в локальный словарь');
    };
  });
}

// ---- Добавление вручную ----
function addManual(){
  const w = document.getElementById('manualWord').value.trim();
  if(!w) return alert('Введите слово');
  const obj = {
    word: normalizeWord(w),
    translation: document.getElementById('manualTranslation').value.trim(),
    type: document.getElementById('manualType').value.trim()
  };
  selected.push(obj);
  renderSelectedTable();
  document.getElementById('manualWord').value = '';
  document.getElementById('manualTranslation').value = '';
  document.getElementById('manualType').value = '';
}

// ---- Работа с локальным словарём (localStorage) ----
function getLocalDict(){
  try{ return JSON.parse(localStorage.getItem('myDict') || '[]'); }
  catch(e){ return []; }
}

function setLocalDict(arr){
  localStorage.setItem('myDict', JSON.stringify(arr));
}

function saveSingleToLocal(entry){
  const prev = getLocalDict();
  const w = normalizeWord(entry.word);
  if(!prev.some(p => p.word === w)){
    prev.push({ word: w, translation: entry.translation, type: entry.type });
    setLocalDict(prev);
  }
}

function saveSelectedToLocal(){
  const prev = getLocalDict();
  selected.forEach(s =>{
    const w = normalizeWord(s.word);
    if(!prev.some(p => p.word === w)) prev.push({ word: w, translation: s.translation, type: s.type });
  });
  setLocalDict(prev);
  alert('Выбранные слова добавлены в локальный словарь');
}

function showLocalPreview(){
  const pre = document.getElementById('localPreview');
  pre.textContent = JSON.stringify(getLocalDict(), null, 2);
}

// ---- Экспорт / импорт файлов ----
function exportDictToFile(){
  const data = JSON.stringify(getLocalDict(), null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'myDict.json';
  a.click();
}

function importFileToSelected(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const arr = JSON.parse(e.target.result);
      if(!Array.isArray(arr)) throw new Error('Неверный формат');
      // добавляем в локальный словарь
      const prev = getLocalDict();
      arr.forEach(item => {
        const w = normalizeWord(item.word || item);
        if(!prev.some(p => p.word === w)) prev.push({ word: w, translation: item.translation || '', type: item.type || '' });
      });
      setLocalDict(prev);
      alert('Импорт завершен');
      showLocalPreview();
    }catch(err){ alert('Ошибка импорта'); }
  };
  reader.readAsText(file);
}

// ---- Загрузка и инициализация выбранного текста и базы ----
async function loadSelectedTextAndData(item){
  try{
    const textJson = await loadJSON(item.file);
    // если файл — массив, как у тебя — берем [0].text или text
    const textObj = Array.isArray(textJson) ? textJson[0] : textJson;
    const raw = textObj.text || textObj;
    const paragraphs = processText(raw);
    renderTextParagraphs(paragraphs);
  }catch(err){ alert('Ошибка загрузки текста: ' + err.message); }

  // пытаемся загрузить sentences_{n}.json рядом с файлом (предполагается имя в item.data)
  if(item.data){
    try{
      dictionaryData = await loadJSON(item.data);
      buildReverseIndex();
    }catch(e){ /* нет данных */ }
  } else {
    // если нет указания data, попытаемся угадать по имени файла
    const guessed = item.file.replace(/insord(\d+)\.json$/, 'sentences_$1.json');
    try{ dictionaryData = await loadJSON(guessed); buildReverseIndex(); }catch(e){}
  }
}

// ---- Инициализация страницы ----
async function init(){
  await loadTextsList();
  document.getElementById('reloadTexts').onclick = loadTextsList;

  document.getElementById('textsSelect').onchange = async (e) => {
    const item = JSON.parse(e.target.value);
    currentTextFile = item.file;
    await loadSelectedTextAndData(item);
  };

  document.getElementById('saveBtn').onclick = saveSelectedToLocal;
  document.getElementById('exportBtn').onclick = exportDictToFile;
  document.getElementById('importFile').onchange = (e) => { if(e.target.files[0]) importFileToSelected(e.target.files[0]); };
  document.getElementById('addManual').onclick = addManual;
  document.getElementById('clearBtn').onclick = () => { selected = []; renderSelectedTable(); };
  document.getElementById('openLocal').onclick = showLocalPreview;
  document.getElementById('downloadLocal').onclick = exportDictToFile;
  document.getElementById('importToLocal').onclick = () => document.getElementById('importFile').click();

  // загрузим первый элемент
  const sel = document.getElementById('textsSelect');
  if(sel.options.length) {
    sel.selectedIndex = 0;
    sel.dispatchEvent(new Event('change'));
  }
}

init();
</script>
</body>
</html>
