<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Fill-in-the-blank interactive</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 30px; }
h2 { color: #333; }
#story p { text-indent: 20px; margin: 0 0 1em 0; line-height: 1.6; }
.placeholder, .insertedWord { display: inline-block; min-width: 60px; padding: 5px; margin: 0 3px; border-bottom: 2px solid #555; vertical-align: middle; text-align: center; }
.placeholder { background: #fff; cursor: grab; }
.insertedWord { background: #2196F3; color: #fff; cursor: grab; border-radius: 4px; }
#choices { margin-top: 20px; min-height: 50px; padding: 10px; border: 1px solid #ccc; background: #e9e9e9; border-radius: 5px; text-align: center; }
.word { display: inline-block; padding: 8px 12px; margin: 5px; background: #4CAF50; color: #fff; border-radius: 5px; cursor: grab; user-select: none; }
.word.dragging, .insertedWord.dragging { opacity: 0.5; }
#controls { margin-bottom: 15px; }
#check, #refresh, #generateWords { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-right: 10px;}
#result { margin-top: 15px; font-weight: bold; font-size: 18px; text-align:center;}
label { margin-right: 10px; }
#userPanel {
  position: fixed;
  bottom: 10px;
  left: 10px; /* теперь слева */
  background: rgba(255,255,255,0.8);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

#statsWindow {
  position: fixed;
  bottom: 10px;
  right: 10px; /* теперь справа */
  background: rgba(255,255,255,0.8);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  max-height: 200px;
  overflow-y: auto;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
@media (max-width: 600px) { body { padding: 12px; } .word, .insertedWord { font-size: 16px; padding: 6px 10px; } }
</style>
</head>
<body>

<h2>Udfyld de manglende ord:</h2>

<div id="controls">
  <label>Antal ord til at indsætte: <input type="number" id="numWords" min="1" max="10" value="3"></label>
  <label><input type="checkbox" id="mobileMode"> Mobiltilstand</label>
  <button id="generateWords">Generer ord</button>
  <button id="refresh">Opdater tekst</button>
  <button id="check">Check</button>
</div>

<div id="story"></div>
<div id="choices"></div>
<div id="result"></div>

<!-- Пользователь и статистика -->
<div id="userPanel">
  Brugernavn: <input type="text" id="usernameInput" style="width:100px;"> <button id="logoutBtn">Log ud</button>
</div>
<div id="statsWindow"><div id="statsContent"></div></div>

<script>
// === USER SYSTEM ===
let userObj = JSON.parse(localStorage.getItem("loggedUser") || '{"username":"Guest","password":"","accessLevel":1}');
const usernameInput = document.getElementById("usernameInput");
usernameInput.value = userObj.username;

usernameInput.addEventListener("change", e=>{
  userObj.username = e.target.value || "Guest";
  localStorage.setItem("loggedUser", JSON.stringify(userObj));
  updateStatsWindow();
});

document.getElementById("logoutBtn").addEventListener("click", ()=>{
  localStorage.removeItem("loggedUser");
  userObj = {username:"Guest",password:"",accessLevel:1};
  usernameInput.value = "Guest";
  updateStatsWindow();
  alert("Log ud udført. Brugernavn sat til Guest.");
});

// --- LOG SYSTEM ---
function logStat(correctCount, wrongCount){
  const now = new Date();
  const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+
             String(now.getDate()).padStart(2,'0')+' '+
             String(now.getHours()).padStart(2,'0')+':'+
             String(now.getMinutes()).padStart(2,'0');

  let pageName = document.title;
  if(!pageName || pageName.trim() === ''){
    const h1 = document.querySelector('h1');
    pageName = h1 ? h1.textContent : 'Ukendt side';
  }

  const entry = ts + ' — ' + loggedUser + ' — ' + pageName + ' — ' + correctCount + ' rigtige / ' + wrongCount + ' forkerte';

  let logs = JSON.parse(localStorage.getItem('userLogs') || '[]');
  logs.push(entry);
  localStorage.setItem('userLogs', JSON.stringify(logs));
  updateStatsWindow();
}

function updateStatsWindow(){
  const content = document.getElementById('statsContent');
  const logs = JSON.parse(localStorage.getItem('userLogs') || '[]');
  // показываем последние 20 записей
  content.innerHTML = logs.slice(-20).reverse().map(l => `<div>${l}</div>`).join('');
}

// --- USER SESSION ---
let loggedUser = localStorage.getItem("loggedUser") || "Guest";
const usernameInput = document.getElementById("usernameInput");
usernameInput.value = loggedUser;

usernameInput.addEventListener("change", e=>{
  loggedUser = e.target.value || "Guest";
  localStorage.setItem("loggedUser", loggedUser);
  updateStatsWindow();
});

document.getElementById("logoutBtn").addEventListener("click", ()=>{
  localStorage.removeItem("loggedUser");
  loggedUser = "Guest";
  usernameInput.value = "Guest";
  updateStatsWindow();
  alert("Log ud udført. Brugernavn sat til Guest.");
});

// === EXERCISE LOGIC ===
let texts = [];
let currentText = null;
let availableWords = [];
let selectedWords = [];
let dragged = null;
let fromChoice = false;
let mobileMode = false;
let selectedWordForTap = null;

// Загрузка JSON с рассказами
fetch('insord0.json')
  .then(res => res.json())
  .then(data => {
    texts = data.map(item => ({ text: item.text.split('/br').map(p => `<p>${p.trim()}</p>`).join('') }));
    loadRandomText();
  })
  .catch(() => {
    const fallback = "I morges sprang jeg hurtigt ud af sengen, og prøvede jeg at finde mine sko, men de lå gemt under sofaen. /br Da jeg endelig fandt dem, løb jeg ud af døren og nåede lige bussen i sidste øjeblik.";
    texts = [{ text: fallback.split('/br').map(p => `<p>${p.trim()}</p>`).join('') }];
    loadRandomText();
  });

// --- Random text selection ---
function loadRandomText() {
  const randomIndex = Math.floor(Math.random() * texts.length);
  currentText = JSON.parse(JSON.stringify(texts[randomIndex]));
  generateWords();
}

// --- Shuffle helper ---
function shuffleArray(arr) { return arr.slice().sort(() => Math.random() - 0.5); }

// --- Extract words ---
function extractWords(text){
  try { return text.match(/[\p{L}\p{M}]+/gu) || []; } 
  catch(e){ return text.match(/\b[\wæøåÆØÅ]+\b/g) || []; }
}

// --- Tokenize ---
function tokenize(text){
  try { return text.match(/[\p{L}\p{M}]+|[^\p{L}\p{M}]+/gu) || [text]; } 
  catch(e){ return text.split(/(\W+)/); }
}

// --- Generate words for blanks ---
function generateWords() {
  const num = parseInt(document.getElementById('numWords').value);
  let allWords = extractWords(currentText.text);
  if(!allWords) allWords = [];
  const uniqueWords = [...new Set(allWords)];
  selectedWords = shuffleArray(uniqueWords).slice(0, Math.min(num, uniqueWords.length));
  availableWords = selectedWords.slice();
  renderStory();
  renderWords();
  document.getElementById('result').textContent = '';
}

// --- Render story with placeholders ---
function renderStory() {
  let newText = currentText.text;
  selectedWords.forEach(word => {
    const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`\\b${escapedWord}\\b`);
    const placeholderHTML = `<span class="placeholder" data-expected="${word.toLowerCase()}" ondrop="dropWord(event)" ondragover="allowDrop(event)" onclick="tapPlaceholder(event)">___</span>`;
    newText = newText.replace(regex, placeholderHTML);
  });
  document.getElementById('story').innerHTML = newText;
}

// --- Render word choices ---
function renderWords() {
  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = availableWords.map((w,i) =>
    `<div class="word" ${mobileMode?'':'draggable="true"'} id="word${i}" ondragstart="dragWord(event)" onclick="tapWord(event)">${w}</div>`
  ).join('');
}

// --- Drag & Drop ---
function allowDrop(ev){ ev.preventDefault(); }

function dragWord(ev){
  if(mobileMode) return;
  dragged = ev.target; fromChoice=true;
  ev.dataTransfer.setData("text", ev.target.textContent);
  ev.target.classList.add('dragging');
}

function dropWord(ev){
  if(mobileMode) return;
  ev.preventDefault();
  const placeholder = ev.target;
  if(!dragged) return;

  const expected = placeholder.dataset && placeholder.dataset.expected ? placeholder.dataset.expected : null;
  const wordText = dragged.textContent.trim();

  const span = document.createElement('span');
  span.className = 'insertedWord';
  span.draggable = true;
  span.textContent = wordText;
  if(expected) span.dataset.expected = expected;
  span.ondragstart = dragInsertedWord;
  span.onclick = tapInsertedWord;
  placeholder.parentNode.replaceChild(span, placeholder);

  if(fromChoice){
    const index = availableWords.indexOf(dragged.textContent);
    if(index>-1) availableWords.splice(index,1);
    renderWords();
  }
  if(dragged) dragged.classList.remove('dragging');
  dragged=null;
}

function dragInsertedWord(ev){
  if(mobileMode) return;
  const wordEl = ev.target;
  dragged = wordEl; fromChoice=false;
  ev.dataTransfer.setData("text", wordEl.textContent);
  ev.target.classList.add('dragging');

  const wordText = wordEl.textContent.trim();
  availableWords.push(wordText);
  renderWords();

  const placeholder = document.createElement('span');
  placeholder.className = 'placeholder';
  placeholder.textContent = '___';
  if(wordEl.dataset && wordEl.dataset.expected) placeholder.dataset.expected = wordEl.dataset.expected;
  placeholder.ondrop = dropWord;
  placeholder.ondragover = allowDrop;
  placeholder.onclick = tapPlaceholder;
  wordEl.parentNode.replaceChild(placeholder, wordEl);
  dragged=null;
}

// --- Mobile tap ---
function tapWord(ev){
  if(!mobileMode) return;
  const el = ev.currentTarget;
  const word = el.textContent.trim();
  if(selectedWordForTap===word){ selectedWordForTap=null; el.style.background=''; }
  else{ selectedWordForTap=word; document.querySelectorAll('#choices .word').forEach(w=>w.style.background='#4CAF50'); el.style.background='#1976D2'; }
}

function tapPlaceholder(ev){
  if(!mobileMode||!selectedWordForTap) return;
  const placeholder = ev.target;
  const expected = placeholder.dataset && placeholder.dataset.expected ? placeholder.dataset.expected : null;
  const wordText = selectedWordForTap;

  const span = document.createElement('span');
  span.className='insertedWord'; span.textContent=wordText;
  if(expected) span.dataset.expected=expected;
  span.draggable=false; span.onclick=tapInsertedWord;
  placeholder.parentNode.replaceChild(span, placeholder);

  const idx = availableWords.indexOf(selectedWordForTap);
  if(idx>-1) availableWords.splice(idx,1);
  selectedWordForTap=null;
  renderWords();
}

function tapInsertedWord(ev){
  if(!mobileMode) return;
  const wordEl = ev.target;
  const wordText = wordEl.textContent.trim();
  const expected = wordEl.dataset && wordEl.dataset.expected ? wordEl.dataset.expected : null;

  availableWords.push(wordText);
  renderWords();

  const placeholder = document.createElement('span');
  placeholder.className='placeholder';
  placeholder.textContent='___';
  if(expected) placeholder.dataset.expected=expected;
  placeholder.ondrop=dropWord;
  placeholder.ondragover=allowDrop;
  placeholder.onclick=tapPlaceholder;
  wordEl.parentNode.replaceChild(placeholder,wordEl);
}

// --- Check ---
document.getElementById('check').addEventListener('click', () => {
  const inserted = Array.from(document.querySelectorAll('.insertedWord'));
  let allCorrect = true; let correctCount=0; let wrongCount=0;

  inserted.forEach(el=>{
    const actual = el.textContent.trim().toLowerCase();
    const expected = el.dataset && el.dataset.expected ? el.dataset.expected.toLowerCase() : null;
    if(expected && actual===expected){ el.style.background='#d4edda'; el.style.borderBottom='2px solid green'; correctCount++; }
    else{ el.style.background='#f8d7da'; el.style.borderBottom='2px solid red'; allCorrect=false; wrongCount++; }
  });

  document.getElementById('result').textContent = allCorrect?'Alle svar er korrekte! 🎉':'Nogle svar er forkerte. Prøv igen.';
  logStat(correctCount,wrongCount);
});

// Кнопки
document.getElementById('refresh').addEventListener('click', loadRandomText);
document.getElementById('generateWords').addEventListener('click', generateWords);
document.getElementById('mobileMode').addEventListener('change', (e) => {
  mobileMode = e.target.checked;
  selectedWordForTap = null;
  // при переключении режима: делаем renderWords чтобы обновить draggable атрибуты и убрать подсветки
  renderWords();
});
</script>

</body>
</html>
